# ============================================================
#  Configuración de Alembic (migraciones de BD) · PlaneAI UdeA
# ------------------------------------------------------------
#  Nota importante: la URL de la base de datos NO se escribe aquí.
#  Se inyecta en tiempo de ejecución desde el .env dentro de
#  alembic/env.py, para no exponer la contraseña en un archivo
#  versionado en Git.
# ============================================================

[alembic]
# Ubicación de los scripts de migración (relativa a la carpeta backend/).
script_location = alembic

# Plantilla de nombre de cada migración: fecha + revisión + descripción.
# (Los %% son escapes requeridos por el formato .ini.)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Añade la carpeta backend/ al sys.path para poder importar el paquete `app`.
prepend_sys_path = .

# sqlalchemy.url  -> se define dinámicamente en alembic/env.py (desde el .env)

[post_write_hooks]

# ---------------- Configuración de logging ----------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
